name: Deploy QA to Render

on:
  push:
    branches:
      - develop

env:
  # Variables para contexto del workflow
  NODE_VERSION: '20'
  PORT: '3000'
  # Render service configuration
  RENDER_SERVICE: srv-db41o3ei0phs73em0aeg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C server run build

      - name: Build Docker image
        run: |
          docker build -t qa-backend:latest -f server/Dockerfile .
          echo "Docker image built successfully"

      - name: Configure Render credentials
        run: |
          # Configurar credenciales para deploy a Render
          # Exportar credenciales como variables de entorno
          EXPORT RENDER_TOKEN="${{ secrets.RENDER_TOKEN }}"
          EXPORT RENDER_SERVICE="srv-db41o3ei0phs73em0aeg"
          echo "Render service ID: $RENDER_SERVICE"
          echo "Render token configured"

  verify-tasks:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Verify deployment
        run: |
          echo "Verifying QA deployment..."
          sleep 30  # Render needs time to initialize

      - name: Health check
        run: |
          HEALTH_URL="https://qa-miayudatics-v1-0.onrender.com/api/health"
          if curl -f $HEALTH_URL; then
            echo "✅ QA deployment successful"
          else
            echo "❌ QA deployment health check failed"
            exit 1
          fi
