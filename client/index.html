<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=no" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#04324d" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- iOS App Mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiAyudaTIC" />
    
    <!-- iOS Icons & Splash -->
    <link rel="apple-touch-icon" href="/icons/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/logo.png" />
    
    <!-- iPad Splash Screen (2048x2732) -->
    <link rel="apple-touch-startup-image" 
          media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" 
          href="/icons/logo.png" />
    <!-- iPhone Splash Screen (1284x2778) -->
    <link rel="apple-touch-startup-image" 
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" 
          href="/icons/logo.png" />
    <!-- Generic fallback -->
    <link rel="apple-touch-startup-image" href="/icons/logo.png" />
    
    <!-- Disable Tap Highlight on iOS -->
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Tap highlight */
      * { -webkit-tap-highlight-color: transparent; }
      /* Allow text selection in inputs */
      input, textarea, select { -webkit-user-select: text; user-select: text; }

      /* Fix Chrome/Safari autofill gray background on desktop inputs (bg-white) */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
        -webkit-text-fill-color: #111827 !important;
        transition: background-color 86400s ease-in-out 0s !important;
      }
      /* Override for phone auth fields (bg: #F8FAFB, text: #2E3E5C) */
      .phone-auth-input:-webkit-autofill,
      .phone-auth-input:-webkit-autofill:hover,
      .phone-auth-input:-webkit-autofill:focus,
      .phone-auth-input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #F8FAFB inset !important;
        -webkit-text-fill-color: #2E3E5C !important;
        transition: background-color 86400s ease-in-out 0s !important;
      }
    </style>
    
    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="/icons/logo.png" />
    
    <!-- Open Graph for sharing -->
    <meta property="og:title" content="MiAyudaTIC" />
    <meta property="og:description" content="Sistema de Gestión y Soporte Técnico TIC - SENA CTPI" />
    <meta property="og:image" content="/icons/logo.png" />
    <meta property="og:type" content="application/x-web-app" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>MiAyudaTIC · Centro de Soporte TIC</title>
  </head>
  <body class="w-full">
    <div id="root"></div>
    <style>
      /* Hide root while React is loading */
      #root:empty {
        display: none;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration with Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        // Track if there was already an active SW when the page loaded.
        // If yes, a controllerchange means an UPDATE → force reload for fresh code.
        // If no, it's the first install → no reload needed (page already loading fresh).
        var _swHadController = Boolean(navigator.serviceWorker.controller)
        var _swReloading = false

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[SW] Registered', reg.scope)

              // Si hay una actualización esperando, activarla inmediatamente
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' })
              }

              reg.addEventListener('updatefound', function () {
                var newWorker = reg.installing
                if (newWorker) {
                  newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' })
                    }
                  })
                }
              })
            })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err)
            })
        })

        // When a new SW takes control, reload ONLY if it's an update (not first install)
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (_swReloading || !_swHadController) return
          _swReloading = true
          console.log('[SW] Updated — reloading for fresh assets')
          window.location.reload()
        })
      }

      // Prevent zoom on double-tap (iOS)
      var _lastTouch = 0
      document.addEventListener('touchend', function (e) {
        var now = Date.now()
        if (now - _lastTouch <= 300) e.preventDefault()
        _lastTouch = now
      }, false)

      // === VERSION CHECK: Fuerza reload si hay deploy nueva ===
      // Cada 5 minutos verifica si la versión cambió
      // Si cambió → reload automático → todos consumen la versión nueva
      ;(function() {
        var CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5 minutos
        var STORAGE_KEY = 'app_build_id';
        var currentBuildId = null;

        // Fetch version.json and get current buildId
        function checkVersion() {
          fetch('/version.json?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
              currentBuildId = data.buildId;
              var storedBuildId = localStorage.getItem(STORAGE_KEY);
              
              // Primera vez o versión cambió → actualizar y recargar
              if (!storedBuildId) {
                localStorage.setItem(STORAGE_KEY, currentBuildId);
              } else if (storedBuildId !== currentBuildId) {
                console.log('[VERSION] Nuevo deploy detectado: ' + storedBuildId + ' → ' + currentBuildId + '. Recargando...');
                localStorage.setItem(STORAGE_KEY, currentBuildId);
                // Espera un poquito para asegurar que el localStorage se escribió
                setTimeout(function() {
                  window.location.reload();
                }, 100);
              }
            })
            .catch(err => {
              console.warn('[VERSION] Error al verificar versión:', err);
            });
        }

        // Check on load
        window.addEventListener('load', checkVersion);

        // Check periódicamente (cada 5 min)
        setInterval(checkVersion, CHECK_INTERVAL_MS);

        // También check cuando la app vuelve del background (visible change)
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkVersion();
          }
        });
      })();
    </script>
  </body>
</html>
